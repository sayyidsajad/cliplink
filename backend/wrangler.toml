# ClipLink backend configuration.
# All tunable limits live here [vars] — nothing is hard-coded in the source.

name = "api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# ---- storage ----
# Blobs live in Supabase Storage (cardless free tier) — see src/supabase.js.
# Secrets (SUPABASE_URL, SUPABASE_SERVICE_KEY) are `wrangler secret put` items.

[[d1_databases]]
binding = "DB"
database_name = "cliplink"
# Printed by `wrangler d1 create cliplink`.
database_id = "f314890a-fdfe-492c-9678-e1796d75bdd9"

# ---- scheduled cleanup of expired objects ----
[triggers]
crons = ["*/10 * * * *"]

# ---- limits (server-enforced; the Mac app treats them as advisory) ----
[vars]
STORAGE_BUCKET = "cliplink-files"
MAX_FILE_MB = "49"           # max upload size per file (Supabase free tier caps objects at 50 MB)
EXPIRY_HOURS = "24"          # link lifetime (integer hours)
# EXPIRY_MINUTES overrides EXPIRY_HOURS when set (used by tests)
RATE_LIMIT_UPLOADS = "30"    # uploads per identity per window
RATE_WINDOW_MINUTES = "60"   # rate-limit window
ROW_RETENTION_DAYS = "7"     # keep expired metadata rows this long for "expired" pages, then purge
MAX_STORAGE_GB = "0.9"       # stored-bytes ceiling; oldest objects evicted past it (Supabase free is 1 GB)
PUBLIC_BASE_URL = ""         # leave empty to derive the public origin from the request

# ---- test environment: tiny limits so expiry/rate/size paths are exercisable locally ----
[env.tiny.vars]
STORAGE_BUCKET = "cliplink-dev"
MAX_FILE_MB = "1"
EXPIRY_HOURS = "24"
EXPIRY_MINUTES = "0.2"
RATE_LIMIT_UPLOADS = "3"
RATE_WINDOW_MINUTES = "60"
ROW_RETENTION_DAYS = "7"
MAX_STORAGE_GB = "0.01"      # tiny budget so the budget paths are exercisable locally
PUBLIC_BASE_URL = ""

[[env.tiny.d1_databases]]
binding = "DB"
database_name = "cliplink"
# Printed by `wrangler d1 create cliplink`.
database_id = "f314890a-fdfe-492c-9678-e1796d75bdd9"

[env.tiny.triggers]
crons = ["*/10 * * * *"]
